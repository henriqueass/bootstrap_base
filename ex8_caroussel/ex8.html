<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carousel Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body> 
    <!-- 1ª Digitação (Aqui) -->
    <div class="container mt-3">
        <div id="carouselExemplo" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="https://placehold.co/600x400/000000/FFF" class="d-block w-100" alt="Slide 1">
                </div>

                <div class="carousel-item">
                    <img src="https://placehold.co/600x400/orange/white" class="d-block w-100" alt="Slide 2">
                </div>

                <div class="carousel-item">
                    <img src="https://placehold.co/600x400/gray/black" class="d-block w-100" alt="3">
                </div>

                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExemplo" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon"></span>
                </button>

                <button class="carousel-control-next" type="button" data-bs-target="#carouselExemplo" data-bs-slide="next">
                    <span class="carousel-control-next-icon"></span>
                </button>

            </div>
        </div>
    </div>

    <!-- 1ª Digitação (Aqui) -->
    <div class="container mt-3">
        <div id="carouselExemploDois" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="https://octane.rent/wp-content/uploads/2024/06/mercedes_benz_c200_blue_01-600x400.webp" class="d-block w-100" alt="Slide 1">
                </div>

                <div class="carousel-item">
                    <img src="https://www.carscoops.com/wp-content/uploads/2022/01/Devel-Sixteen.jpg" class="d-block w-100" alt="Slide 2">
                </div>

                <div class="carousel-item">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTdL-zmpN87n83-9sv4aLlqFNaKAju9GksNeA&s" class="d-block w-100" alt="3">
                </div>

                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExemploDois" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon"></span>
                </button>

                <button class="carousel-control-next" type="button" data-bs-target="#carouselExemploDois" data-bs-slide="next">
                    <span class="carousel-control-next-icon"></span>
                </button>

            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
